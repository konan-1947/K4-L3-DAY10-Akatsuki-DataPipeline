[project]
name = "day10-data-observability-lab-student"
version = "0.1.0"
description = "Student starter lab for Day 10 data pipeline, data observability, and RAG evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb==1.5.9",
  "datasets==5.0.0",
  "great-expectations==1.18.0",
  "langchain==1.3.4",
  "langchain-anthropic==1.4.4",
  "langchain-google-genai==4.2.4",
  "langchain-ollama==1.1.0",
  "langchain-openai==1.2.2",
  "openai==2.41.0",
  "instructor==1.15.1",
  "pandas==3.0.3",
  "python-dotenv==1.2.2",
  "ragas==0.4.3",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
